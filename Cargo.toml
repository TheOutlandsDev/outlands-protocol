[workspace]
members = [
    "crates/out-primitives",
    "crates/out-codec",
    "crates/out-crypto",
    "crates/out-state",
    "crates/out-consensus",
    "crates/out-storage",
    "crates/out-node",
    "crates/out-p2p",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["zeroize"] }
blake3 = { version = "=1.8.7", default-features = false }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
crypto-bigint = { version = "=0.7.5", default-features = false }
curve25519-dalek = { version = "=5.0.0", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
poly1305 = { version = "=0.9.1", default-features = false, features = ["zeroize"] }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs", "termios"] }
unicode-normalization = { version = "=0.1.25", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
float_arithmetic = "deny"
